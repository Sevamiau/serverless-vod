<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ver — film.ar</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js"></script>
</head>
<body class="page--dark">
    <header class="header js-header">
        <div class="header__container container">
            <a href="index.html" class="header__logo js-header-logo" aria-label="Inicio">
                <span class="header__logo-text">film.ar</span>
            </a>

            <div class="header__right-container">
                <nav class="header__navigation">
                    <a href="entrar.html" class="header__auth-link">Entrar</a>
                </nav>

                <button type="button" class="hamburger-menu js-hamburger-menu" aria-label="Abrir menú" aria-expanded="false">
                    <div></div><div></div><div></div>
                </button>

                <div class="header__menu-container js-header-menu-container">
                    <nav class="header__menu">
                        <a href="sobre.html">Sobre el proyecto</a>
                        <a href="faqs.html">Preguntas frecuentes</a>
                        <a href="contacto.html">Contacto</a>
                        <div class="header__menu-auth-mobile">
                            <a href="entrar.html" class="header__auth-link">Entrar</a>
                        </div>
                    </nav>
                </div>
            </div>
        </div>
    </header>

    <main class="app-page">
        <div class="app-page__main app-page__main--wide">
            <div class="app-page__toolbar">
                <h1 class="app-page__title">El florecer de un bombisto</h1>
                <button id="logout" class="button button--outline">Salir</button>
            </div>
            <button id="play" class="button button--white app-page__play">Ver</button>
            <div id="message" class="notice" role="status" aria-live="polite"></div>
            <div id="devices" class="device-list"></div>
            <video id="video" controls playsinline hidden></video>
            <label class="quality" hidden>Calidad
                <select id="quality"></select>
            </label>
            <details class="app-details">
                <summary>Detalles técnicos</summary>
                <div id="status" class="app-status"></div>
            </details>
        </div>
    </main>

    <footer class="footer footer--static">
        <div class="footer__container container">
            <div class="footer__social-container">
                <a href="https://instagram.com/" target="_blank" rel="noopener" aria-label="Instagram">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="2.5" width="19" height="19" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.6" cy="6.4" r="1" fill="currentColor" stroke="none"/></svg>
                </a>
                <a href="https://youtube.com/" target="_blank" rel="noopener" aria-label="YouTube">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12 31 31 0 0 0 1 16.8a3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8zM9.7 15.1V8.9l5.8 3.1-5.8 3.1z"/></svg>
                </a>
            </div>
            <nav class="footer__legal" aria-label="Legales">
                <a href="terminos.html">Términos</a>
                <a href="privacidad.html">Privacidad</a>
                <a href="arrepentimiento.html">Botón de arrepentimiento</a>
            </nav>
        </div>
    </footer>

    <script src="main.js"></script>
<script>
  const SRC = '/movie/film01/master.m3u8';
  const REFRESH_MS = 4 * 60 * 1000; // cookie lasts 5 min
  const RETRY_REFRESH_MS = 15 * 1000;
  const MAX_REFRESH_RETRIES = 3;
  const MAX_RECOVERY_ATTEMPTS = 4;
  const MAX_FATAL_STREAK = 3;
  const statusEl = document.getElementById('status');
  const messageEl = document.getElementById('message');
  const devicesEl = document.getElementById('devices');
  const video = document.getElementById('video');
  const playBtn = document.getElementById('play');
  const qualityEl = document.getElementById('quality');
  let hls = null;
  let playerReady = false;
  let loadingStopped = false;
  let refreshTimer = null;
  let refreshRetries = 0;
  let lastMintAt = 0;
  let recovering = false;
  let fatalStreak = 0;

  function log(line) {
    statusEl.textContent += line + '\n';
  }

  function showMessage(text, kind = 'error', link) {
    messageEl.className = `notice ${kind}`;
    messageEl.textContent = text;
    if (link) {
      const a = document.createElement('a');
      a.href = link.href;
      a.textContent = link.text;
      messageEl.append(' ', a);
    }
  }

  function clearMessage() {
    messageEl.className = 'notice';
    messageEl.textContent = '';
    devicesEl.replaceChildren();
  }

  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  function getDeviceId() {
    let id = localStorage.getItem('deviceId');
    if (!id) {
      id = crypto.randomUUID();
      localStorage.setItem('deviceId', id);
    }
    return id;
  }

  function deviceLabel() {
    const ua = navigator.userAgent;
    const browser = /Edg\//.test(ua) ? 'Edge'
      : /Firefox\//.test(ua) ? 'Firefox'
      : /Chrome\//.test(ua) ? 'Chrome'
      : /Safari\//.test(ua) ? 'Safari'
      : 'Navegador';
    const os = /iPhone/.test(ua) ? 'iPhone'
      : /iPad/.test(ua) ? 'iPad'
      : /Android/.test(ua) ? 'Android'
      : /Windows/.test(ua) ? 'Windows'
      : /Mac OS X/.test(ua) ? 'Mac'
      : /Linux/.test(ua) ? 'Linux'
      : 'otro sistema';
    return `${browser} en ${os}`;
  }

  async function sha256Hex(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
  }

  function explainBlocked(data) {
    switch (data.error) {
      case 'no-entitlement':
        showMessage('Tu cuenta no tiene acceso a esta película.', 'error', { href: '/comprar.html', text: 'Comprarla' });
        break;
      case 'device-cap':
        showMessage(`Tu cuenta ya tiene ${data.devices} dispositivos registrados, el máximo es ${data.cap}, ` +
          'y este no es uno de ellos. Los dispositivos que no usás durante 90 días se liberan solos.');
        showDevices();
        break;
      case 'ip-change':
        showMessage('Cambiaste de red hace poco, o tu cuenta se está usando desde otro lugar. Volvé a darle play en unos minutos.');
        break;
      case 'concurrency':
        showMessage('La película se está viendo en otro dispositivo. Cerrala ahí y volvé a darle play en unos minutos.');
        break;
      default:
        showMessage('No tenés permiso para ver la película en este momento.');
    }
  }

  const formatDate = (epochSec) =>
    new Date(epochSec * 1000).toLocaleDateString('es-AR', { day: 'numeric', month: 'long', year: 'numeric' });
  async function showDevices() {
    let data;
    try {
      const res = await fetch('/api/devices', { credentials: 'include' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      data = await res.json();
    } catch (err) {
      log(`devices failed: ${err.message}`);
      return;
    }

    const canRemove = !data.nextRemovalAt || data.nextRemovalAt <= Date.now() / 1000;
    const intro = document.createElement('p');
    intro.textContent = canRemove
      ? 'Podés quitar uno para ver acá. Después vas a poder quitar otro recién en 30 días.'
      : `Ya quitaste un dispositivo hace poco. Vas a poder quitar otro a partir del ${formatDate(data.nextRemovalAt)}.`;

    const list = document.createElement('ul');
    for (const device of data.devices) {
      const item = document.createElement('li');
      const name = document.createElement('span');
      name.textContent = `${device.label} · usado por última vez el ${formatDate(device.lastSeen)}`;
      item.append(name);
      if (canRemove) {
        const button = document.createElement('button');
        button.className = 'button button--outline';
        button.textContent = 'Quitar';
        button.addEventListener('click', () => removeDevice(device, button));
        item.append(button);
      }
      list.append(item);
    }
    devicesEl.replaceChildren(intro, list);
  }

  async function removeDevice(device, button) {
    if (!confirm(`¿Quitar "${device.label}"? Vas a poder quitar otro dispositivo recién en 30 días.`)) return;
    button.disabled = true;

    const body = JSON.stringify({ deviceHash: device.deviceHash });
    let res;
    try {
      res = await fetch('/api/devices/remove', {
        method: 'POST',
        credentials: 'include',
        headers: { 'content-type': 'application/json', 'x-amz-content-sha256': await sha256Hex(body) },
        body,
      });
    } catch (err) {
      log(`remove device failed: ${err.message}`);
      button.disabled = false;
      return;
    }
    const data = await res.json().catch(() => ({}));
    log(`remove device: HTTP ${res.status} ${data.error ?? ''}`);

    if (res.status === 401) {
      window.location.href = '/entrar.html';
      return;
    }
    if (!res.ok && res.status !== 404) {
      showDevices();
      return;
    }
    clearMessage();
    if (playerReady) {
      video.play().catch(() => {});
    } else {
      start();
    }
  }

  async function mintPlaybackToken() {
    const body = JSON.stringify({ deviceId: getDeviceId(), label: deviceLabel() });
    let res;
    try {
      res = await fetch('/api/playback-token', {
        method: 'POST',
        credentials: 'include',
        headers: { 'content-type': 'application/json', 'x-amz-content-sha256': await sha256Hex(body) },
        body,
      });
    } catch (err) {
      log(`mint failed: ${err.message}`);
      return { ok: false, transient: true };
    }

    const data = await res.json().catch(() => ({}));
    if (res.ok) {
      lastMintAt = Date.now();
      holdingSlot = true;
      log(`mint OK: HTTP ${res.status}`);
      return { ok: true };
    }

    log(`mint failed: HTTP ${res.status} ${data.error ?? ''}`);
    if (res.status === 401) {
      window.location.href = '/entrar.html';
      return { ok: false, transient: false };
    }
    if (res.status === 403) {
      explainBlocked(data);
      return { ok: false, transient: false };
    }
    return { ok: false, transient: true };
  }

  // tells the server this device stopped, so another one can play right away
  let holdingSlot = false;
  let releaseReq = null;
  async function prepareRelease() {
    const body = JSON.stringify({ deviceId: getDeviceId(), release: true });
    releaseReq = { body, hash: await sha256Hex(body) };
  }
  prepareRelease().catch(() => {});

  function releaseSlot() {
    clearTimeout(refreshTimer);
    lastMintAt = 0;
    if (!holdingSlot || !releaseReq) return;
    holdingSlot = false;
    fetch('/api/playback-token', {
      method: 'POST',
      credentials: 'include',
      keepalive: true,
      headers: { 'content-type': 'application/json', 'x-amz-content-sha256': releaseReq.hash },
      body: releaseReq.body,
    }).catch(() => {});
  }

  function stopPlayback() {
    clearTimeout(refreshTimer);
    video.pause();
    if (hls) hls.stopLoad();
    loadingStopped = true;
  }

  function restartLoading() {
    loadingStopped = false;
    if (hls) {
      hls.startLoad();
      return;
    }
    const at = video.currentTime;
    video.src = SRC;
    video.currentTime = at;
    video.play().catch(() => {});
  }

  function scheduleRefresh(ms = REFRESH_MS) {
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(refreshPlaybackToken, ms);
  }

  async function refreshPlaybackToken() {
    const r = await mintPlaybackToken();
    if (r.ok) {
      refreshRetries = 0;
      if (messageEl.classList.contains('warn')) clearMessage();
      scheduleRefresh();
      return;
    }
    if (r.transient && ++refreshRetries <= MAX_REFRESH_RETRIES) {
      showMessage('Problema de conexión, reintentando…', 'warn');
      scheduleRefresh(RETRY_REFRESH_MS);
      return;
    }
    if (r.transient) {
      showMessage('Se perdió la conexión. Revisá tu internet y volvé a darle play.');
    }
    stopPlayback();
  }

  async function recoverNetwork() {
    if (recovering) return;
    recovering = true;
    try {
      if (++fatalStreak > MAX_FATAL_STREAK) {
        showMessage('No pudimos seguir reproduciendo la película. Recargá la página para intentar de nuevo.');
        stopPlayback();
        return;
      }
      for (let attempt = 1; attempt <= MAX_RECOVERY_ATTEMPTS; attempt++) {
        showMessage('Reconectando…', 'warn');
        await sleep(1000 * 2 ** (attempt - 1));
        const r = await mintPlaybackToken();
        if (r.ok) {
          clearMessage();
          scheduleRefresh();
          restartLoading();
          return;
        }
        if (!r.transient) {
          stopPlayback();
          return;
        }
      }
      showMessage('Se perdió la conexión. Revisá tu internet y volvé a darle play.');
      stopPlayback();
    } finally {
      recovering = false;
    }
  }

  function buildQualityMenu() {
    if (hls.levels.length < 2) return;
    const options = [new Option('Auto', '-1')];
    hls.levels
      .map((level, index) => ({ height: level.height, index }))
      .sort((a, b) => b.height - a.height)
      .forEach(({ height, index }) => options.push(new Option(`${height}p`, String(index))));
    qualityEl.replaceChildren(...options);
    qualityEl.parentElement.hidden = false;
  }

  function updateAutoLabel() {
    const level = hls.levels[hls.currentLevel];
    qualityEl.options[0].text = hls.autoLevelEnabled && level ? `Auto (${level.height}p)` : 'Auto';
  }

  qualityEl.addEventListener('change', () => {
    hls.currentLevel = Number(qualityEl.value);
    log(`quality: ${qualityEl.selectedOptions[0].text}`);
  });

  function setUpPlayer() {
    if (Hls.isSupported()) {
      log('using hls.js');
      hls = new Hls();
      hls.on(Hls.Events.FRAG_LOADED, () => { fatalStreak = 0; });
      hls.on(Hls.Events.ERROR, (_evt, data) => {
        log(`hls.js error: ${data.type} / ${data.details}${data.fatal ? ' (fatal)' : ''}`);
        if (!data.fatal) return;
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
          recoverNetwork();
        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR && ++fatalStreak <= MAX_FATAL_STREAK) {
          hls.recoverMediaError();
        } else {
          showMessage('No pudimos seguir reproduciendo la película. Recargá la página para intentar de nuevo.');
          stopPlayback();
        }
      });
      hls.on(Hls.Events.MANIFEST_PARSED, buildQualityMenu);
      hls.on(Hls.Events.LEVEL_SWITCHED, updateAutoLabel);
      hls.loadSource(SRC);
      hls.attachMedia(video);
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      log('native HLS support (Safari) — skipping hls.js');
      video.addEventListener('timeupdate', () => { fatalStreak = 0; });
      video.addEventListener('error', () => {
        log(`video error: code ${video.error?.code}`);
        recoverNetwork();
      });
      video.src = SRC;
    } else {
      return false;
    }
    video.hidden = false;
    playerReady = true;
    return true;
  }

  async function start() {
    playBtn.disabled = true;
    clearMessage();
    log('POST /api/playback-token ...');

    const r = await mintPlaybackToken();
    if (!r.ok) {
      if (r.transient) showMessage('No pudimos conectar. Probá de nuevo en un momento.');
      playBtn.disabled = false;
      return;
    }

    if (!setUpPlayer()) {
      showMessage('Este navegador no puede reproducir la película. Probá con Chrome, Firefox o Safari actualizados.');
      playBtn.disabled = false;
      return;
    }
    playBtn.hidden = true;
    scheduleRefresh();

    try {
      await video.play();
      log('playing');
    } catch (err) {
      log(`video.play() rejected (${err.message}) — use the player controls`);
    }
  }

  async function onResume() {
    if (!playerReady || recovering) return;
    const age = Date.now() - lastMintAt;
    if (age < 60 * 1000 && !loadingStopped) {
      scheduleRefresh(REFRESH_MS - age);
      return;
    }

    log('resuming — re-minting before continuing');
    const r = await mintPlaybackToken();
    if (!r.ok) {
      if (r.transient) showMessage('No pudimos conectar. Probá de nuevo en un momento.');
      video.pause();
      return;
    }
    clearMessage();
    refreshRetries = 0;
    scheduleRefresh();
    if (loadingStopped) restartLoading();
  }

  video.addEventListener('play', onResume);
  video.addEventListener('pause', releaseSlot);
  video.addEventListener('ended', releaseSlot);
  window.addEventListener('pagehide', releaseSlot);
  playBtn.addEventListener('click', start);

  document.getElementById('logout').addEventListener('click', async () => {
    stopPlayback();
    try {
      await fetch('/api/auth/logout', {
        method: 'POST',
        credentials: 'include',
        headers: { 'x-amz-content-sha256': await sha256Hex('') },
      });
    } catch (err) {
      log(`logout failed: ${err.message}`);
    }
    window.location.href = '/entrar.html';
  });
</script>
</body>
</html>
