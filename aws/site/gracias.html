<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gracias — Mi Proyecto</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="page--dark">
    <header class="header js-header">
        <div class="header__container container">
            <a href="index.html" class="header__logo js-header-logo" aria-label="Inicio">
                <span class="header__logo-mark"></span>
                <span class="header__logo-text">mi proyecto</span>
            </a>

            <div class="header__right-container">
                <nav class="header__navigation">
                    <a href="entrar.html" class="header__auth-link">Entrar</a>
                </nav>

                <button type="button" class="hamburger-menu js-hamburger-menu" aria-label="Abrir menú" aria-expanded="false">
                    <div></div><div></div><div></div>
                </button>

                <div class="header__menu-container js-header-menu-container">
                    <nav class="header__menu">
                        <a href="sobre.html">Sobre el proyecto</a>
                        <a href="faqs.html">Preguntas frecuentes</a>
                        <a href="contacto.html">Contacto</a>
                        <div class="header__menu-auth-mobile">
                            <a href="entrar.html" class="header__auth-link">Entrar</a>
                        </div>
                    </nav>
                </div>
            </div>
        </div>
    </header>

    <main class="app-page">
        <div class="app-page__main">
            <h1 id="title" class="app-page__title">Procesando tu pago&hellip;</h1>
            <p id="message" class="app-page__lead">Mercado Pago nos avisa en cuanto confirma el pago &mdash; esto puede tardar unos segundos.</p>
            <div id="trace" class="trace-code"></div>
            <p id="watch-link" class="app-page__lead" style="display:none">Te mandamos un email con un enlace para entrar y ver la película.</p>
            <div id="status" class="app-status"></div>
        </div>
    </main>

    <footer class="footer footer--static">
        <div class="footer__container container">
            <div class="footer__social-container">
                <a href="https://instagram.com/" target="_blank" rel="noopener" aria-label="Instagram">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="2.5" width="19" height="19" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.6" cy="6.4" r="1" fill="currentColor" stroke="none"/></svg>
                </a>
                <a href="https://youtube.com/" target="_blank" rel="noopener" aria-label="YouTube">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12 31 31 0 0 0 1 16.8a3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8zM9.7 15.1V8.9l5.8 3.1-5.8 3.1z"/></svg>
                </a>
            </div>
            <nav class="footer__legal" aria-label="Legales">
                <a href="terminos.html">Términos</a>
                <a href="privacidad.html">Privacidad</a>
                <a href="arrepentimiento.html">Botón de arrepentimiento</a>
            </nav>
        </div>
    </footer>

    <script src="main.js"></script>
<script>
  const statusEl = document.getElementById('status');
  const titleEl = document.getElementById('title');
  const messageEl = document.getElementById('message');
  const traceEl = document.getElementById('trace');
  const watchLinkEl = document.getElementById('watch-link');

  function log(line) {
    statusEl.textContent += line + '\n';
  }

  const params = new URLSearchParams(window.location.search);
  if (params.get('status') === 'failure') {
    titleEl.textContent = 'El pago no se completó';
    messageEl.textContent = 'Mercado Pago reportó un error o un pago rechazado. Podés intentar de nuevo desde /comprar.';
  } else {
    poll();
  }

 
  async function poll(attempt = 0) {
    const orderId = params.get('order_id') || '';
    const res = await fetch(`/api/order-status?order_id=${encodeURIComponent(orderId)}`, { credentials: 'include' });
    const data = await res.json();
    log(`[${attempt}] status: ${data.status}${data.reason ? ' (' + data.reason + ')' : ''}`);

    if (data.status === 'paid') {
      titleEl.textContent = '¡Gracias por tu compra!';
      if (data.traceCode) {
        messageEl.textContent = 'Tu código de copia:';
        traceEl.textContent = data.traceCode;
      } else {
        messageEl.textContent = 'El pago está confirmado. Tu código de copia está en el email.';
      }
      watchLinkEl.style.display = 'block';
      return;
    }

    if (data.status === 'unknown') {
      titleEl.textContent = 'No encontramos tu orden en este navegador';
      messageEl.innerHTML = 'Si ya pagaste, <strong>no vuelvas a pagar</strong>: revisá tu email, te mandamos un enlace para entrar. '
        + 'Si no te llegó, pedí uno nuevo en <a href="/entrar.html">entrar</a>. '
        + 'Si todavía no pagaste, podés empezar la compra en <a href="/comprar.html">comprar</a>.';
      return;
    }

    if (attempt >= 30) {
      titleEl.textContent = 'Esto está tardando más de lo normal';
      messageEl.textContent = 'El pago sigue pendiente después de un minuto. Si ya pagaste, escribinos con tu email.';
      return;
    }

    setTimeout(() => poll(attempt + 1), 2000);
  }
</script>
</body>
</html>
